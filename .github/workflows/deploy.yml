name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SLUG: aryanny-silva
      PORTA: 23020

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker down || true

      - name: Criar redes e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create dados --interna || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create web || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker volume create pgdata || true

      - name: Subir Banco de Dados, API e Front
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name banco --network dados -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} -e POSTGRES_DB=pokedex postgres:17-alpine
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name api --network web -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} gr-atv2-api:1
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network connect dados api
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name front --network web -p ${{ env.PORTA }}:80 -e API=gr-${{ env.SLUG }}-api -e DEPLOY_SHA=${{ github.sha }} gr-atv2-front:1

      - name: Testar se a aplicação respondeu
        run: |
          sleep 5
          curl -f http://gr.lab.ayty.org:${{ env.PORTA }}
